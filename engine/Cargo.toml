[package]
name = "opencto"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local-first multi-agent orchestration engine for OpenCTO"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "opencto"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
