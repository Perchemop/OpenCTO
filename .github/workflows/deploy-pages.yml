name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine logic if truncated
        run: |
          set -e
          LINES=$(wc -l < engine/src/logic.rs || echo 0)
          BYTES=$(wc -c < engine/src/logic.rs || echo 0)
          echo "logic.rs: $LINES lines, $BYTES bytes"
          if [ "$BYTES" -lt 20000 ]; then
            echo "logic.rs looks truncated; restoring known-good source"
            curl -fsSL "https://raw.githubusercontent.com/Perchemop/OpenCTO/4bf6e278449caab748f14dd1d8572ffec5650afd/engine/src/logic.rs" -o engine/src/logic.rs
            wc -l engine/src/logic.rs
            wc -c engine/src/logic.rs
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM engine
        run: |
          set -e
          cargo build --manifest-path engine/Cargo.toml --target wasm32-unknown-unknown --release --lib
          mkdir -p public/engine
          cp engine/target/wasm32-unknown-unknown/release/opencto.wasm public/engine/opencto.wasm
          ls -la public/engine/opencto.wasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (SPA for GitHub Pages)
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare static output
        run: |
          set -e
          if [ -d "dist/client" ]; then
            OUT="dist/client"
          elif [ -d ".output/public" ]; then
            OUT=".output/public"
          elif [ -d "dist" ]; then
            OUT="dist"
          elif [ -d ".vercel/output/static" ]; then
            OUT=".vercel/output/static"
          else
            echo "Could not find static build output"
            ls -la
            exit 1
          fi
          echo "Using output directory: $OUT"
          mkdir -p _site
          cp -a "$OUT"/. _site/

          if [ -f _site/_shell.html ]; then
            cp _site/_shell.html _site/index.html
            cp _site/_shell.html _site/404.html
          elif [ -f _site/index.html ]; then
            cp _site/index.html _site/404.html
          else
            echo "No index.html or _shell.html found in $OUT"
            ls -la _site
            exit 1
          fi

          mkdir -p _site/engine
          if [ -f public/engine/opencto.wasm ]; then
            cp public/engine/opencto.wasm _site/engine/opencto.wasm
          elif [ -f dist/client/engine/opencto.wasm ]; then
            cp dist/client/engine/opencto.wasm _site/engine/opencto.wasm
          fi
          test -f _site/engine/opencto.wasm && echo "wasm: OK ($(wc -c < _site/engine/opencto.wasm) bytes)" || (echo "wasm MISSING" && exit 1)

          echo "--- _site contents ---"
          ls -la _site | head -40
          test -f _site/index.html && echo "index.html: OK" || echo "index.html: MISSING"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
